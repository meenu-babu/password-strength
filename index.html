<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password strength</title>
  <link rel="stylesheet" href="style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    
    <div class="container vh-100 d-flex align-items-center justify-content-center">
        <div class="row justify-content-center w-100">
            <div class="col-md-6 border border-3 rounded shadow p-4 mb-5 bg-body-tertiary">
                <h3 class="text-center">PASSWORD STRENGTH CHECKER</h3>
                <form>
                    <input type="password" class="form-control mt-4" id="input" placeholder="Enter your password here" oninput="checkpwd()">
    
                    <p class="text-center my-3" id="strenthtext"></p>
    
                    <div class="buttons d-grid gap-2 d-md-flex justify-content-center">
                        <button type="button" class="btn btn-success" onclick="submitpwd()">Submit</button>
                        <button type="button" class="btn btn-danger" onclick="resetpwd()">Reset</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
